# fly.toml app configuration file generated for tt4d-morning-darkness-722 on 2025-04-21T01:53:05+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tt4d-api'
primary_region = 'sin'

[build]
  dockerfile = "docker/Dockerfile.api"
  context = "."

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  strategy = "immediate"
